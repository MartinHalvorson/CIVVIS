name: cargo-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # ⚠⚠ `github.sha`, NOT `github.ref`. On a push to `main` the ref is the
  # constant `refs/heads/main`, so every merge shared ONE group — and
  # `cancel-in-progress: false` does not queue them all. GitHub keeps at most
  # one run executing and at most one PENDING per group; a third arrival
  # cancels the pending one. Merges land ~5 minutes apart here and this gate
  # takes 7-13, so the queue was permanently over-subscribed and the middle
  # run was always the one thrown away. Measured 2026-08-18, the 14 most
  # recent `main` runs: 11 cancelled, 3 finished.
  #
  # That matters because the post-merge run is the *entire* safety argument
  # for `strict = false` in AGENTS.md and docs/VERSION_CONTROL.md: a PR is
  # allowed to merge without being up to date with `main` precisely because
  # `main` re-runs the full gate on the real squash result. At ~100 merges a
  # day from a parallel fleet, a semantic conflict between two independently
  # green PRs has nothing else looking for it — and for months that backstop
  # ran on about a fifth of commits.
  #
  # A commit is not superseded by the commit after it. Each `main` sha is its
  # own thing to verify, so each gets its own group and nothing cancels
  # anything. A pull request is different: a newer push really does supersede
  # an older one, and cancelling there is pure savings. Hosted runners are
  # free and unmetered on this public repository, so the cost of the extra
  # concurrent runs is wall-clock on a shared pool, not money.
  #
  # A cancelled run also skips the cache post step, so the only cache lineage
  # other branches could restore from was rarely re-saved.
  group: cargo-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-test:
    # Hosted runners are free and unmetered on a public repository, which this
    # now is. They were briefly self-hosted because metered minutes on the
    # private repo went unpaid and every job died in three seconds on a billing
    # message; that is not a reason to keep running strangers' pull requests on
    # somebody's laptop.
    #
    # Every task starts as a draft PR whose first push is an empty claim
    # commit (`civvis_collab.py start`), which used to burn one full run of
    # all three jobs on a diff of zero bytes — at fleet velocity, a large
    # slice of total CI spend producing no information. `changed_files` in
    # the event payload is 0 exactly then and updates on every synchronize,
    # so real pushes always run. A skipped required check counts as
    # satisfied, but the only PR this can wave through is one whose entire
    # diff against `main` is empty — a merge of nothing. (Deliberately NOT
    # `draft == false`: that would leave the required check "skipped" while
    # `ship` marks ready and arms auto-merge, and in the seconds before the
    # ready_for_review run registers, auto-merge could land unvalidated
    # code.)
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      # lld instead of GNU ld for the test binaries. Six test executables each
      # link the ~85 MB libcivvis rlib, and the default linker does that work
      # serially per binary on a 4-core runner; lld is the one compile-time
      # lever a 2026-08-06 local A/B could not measure on macOS (codegen-units
      # 256 and opt-level 2 both measured as noise there and were dropped).
      # If the gate's compile phase does not measurably improve, revert this —
      # the flag is not worth carrying for free.
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lld with a resilient Ubuntu mirror
        run: bash .github/scripts/install-apt-packages.sh lld
      # Only the dependency registry is cached. `target` was cached here too,
      # but against this crate's shape it could not help: the workspace is a
      # single ~220k-line crate with CARGO_INCREMENTAL pinned to 0, so any
      # source change re-derives every `civvis` artifact from scratch and the
      # only reusable bytes are the dozen small dependency crates. Worse, the
      # lockfile-only key meant the entry hit exactly and was therefore never
      # re-saved (actions/cache entries are immutable) — a frozen multi-GB
      # `target/` from whichever commit first populated it, downloaded and
      # unpacked on every run to contribute nothing. The key stays the
      # lockfile, NOT the commit SHA: a SHA in the key means every push
      # writes a new entry, nothing ever hits, and the 10 GB quota evicts
      # itself. `-deps` is a fresh lineage so the old keys' dead payloads
      # cannot be restored while they age out.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-ci-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-deps-${{ runner.os }}-
      # The `ci` profile inherits `release`, so tests run at the same
      # optimisation level; it only drops the single-codegen-unit and LTO
      # settings that exist to buy the production spectator about four percent
      # simulation throughput. The gate does not run rated games, and
      # serialising the backend over a 100k-line crate is what made this the
      # slowest step in the merge path.
      #
      # nextest instead of `cargo test` for the run phase, for two measured
      # reasons. `cargo test` runs the nine test binaries one after another,
      # so the lib binary's wall-clock tail — the spectator tests that sleep
      # on real sockets — sets the phase's floor on this 4-core runner;
      # nextest schedules every test from every binary in one worker pool.
      # And it prints per-test times, so the next 19-second sleeper shows up
      # in this log instead of hiding inside a two-minute total. Compilation
      # is identical (`--cargo-profile ci`); doc-tests do not run under
      # nextest, and this crate has none that execute (every doc fence is
      # `text` or `ignore`, 3 ignored stubs).
      # ⚠⚠ THE COMPILER HAD BEEN REPORTING REAL DEFECTS TO NOBODY. `cargo test`
      # does not fail on warnings, so they accumulated on `main` unread — and
      # two of them were not style. `settle_site_is_loyalty_doomed` and
      # `barbarian_presence_at_home` were wrappers no production path called,
      # kept compiling only because tests called them: seven and three test
      # assertions exercising a function the shipped binary does not contain,
      # while the code that ships took a different path. Three others were a
      # second `#[test]` above a doc comment, which reads as two attributes and
      # is a typo away from a test that does not run.
      #
      # `rust-quality.yml` gates clippy and rustfmt on CHANGED FILES because
      # those backlogs are large. Plain rustc warnings are a different case:
      # the crate is at zero, so the whole crate can be held there. Restricted
      # to `src/` on purpose — a future dependency's warning is not this
      # repository's build to break.
      - name: The crate compiles without warnings
        run: |
          set -o pipefail
          cargo check --profile ci --locked --all-targets --message-format short \
            2>&1 | tee /tmp/check.txt || true
          if grep -E '^src/[^:]*:[0-9]+:[0-9]+: warning:' /tmp/check.txt; then
            echo
            echo "The compiler reported the warnings above and nothing was failing on"
            echo "them. Fix them, or if one is genuinely wanted, say so with a scoped"
            echo "#[allow(..)] carrying the reason."
            exit 1
          fi
          echo "no rustc warnings in src/"
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --cargo-profile ci --locked

      # ⚠ The worktree audit is the only guard against a whole class of loss
      # that is invisible to every other gate here: finished work left unstaged
      # in an agent worktree, which lives on exactly one disk and has already
      # cost this project four PRs. CI has no fleet to inspect, so the audit
      # builds a throwaway repo with a real remote, a real worktree and a real
      # unstaged edit, and asserts it catches it — and that `--rescue` moves the
      # bytes to the remote without touching the tree an agent may be editing.
      - name: The worktree audit still catches unstaged work
        run: python3 tools/civvis_worktree_audit.py --selftest
      # A comparator with only temporary unit-test traces can silently drift
      # from the replay schema while every test still passes. Keep one small,
      # sanitized transition spine in the repository and require both its
      # canonical hashes and its deliberate negative mutation to stay stable.
      - name: Differential fidelity golden ratchet
        run: python3 tools/check_differential_golden.py
      # `civvis_inert.py` has documented `--max 0` as its "CI ratchet" since it
      # was written, and no workflow ever called it. It needs nothing but the
      # repository, so there was no obstacle — it simply was not wired in, and a
      # data key whose consumer is refactored away goes on doing nothing with
      # every gate green. That is exactly the failure its own docstring
      # describes: the Sphinx kept two dead effects through fourteen iterations.
      #
      # ⚠ The ratchet is ZERO. It was briefly 1, naming `force_retreat` —
      # Poland's Winged Hussar ability, present in `data/units.json` and read by
      # nothing, so the unit was a plain Cuirassier replacement. That is fixed,
      # so the number came down with it. Genuinely descriptive keys are waived
      # by name in `tools/inert_waivers.json` with the reason they are not
      # defects; a new key with no consumer now fails here rather than sitting
      # in the data doing nothing.
      - name: Rules data has no effect key the engine ignores
        run: python3 tools/civvis_inert.py --max 0
      # The same ratchet, one layer up: a gene the screen cannot make fire.
      # `docs/GENE_SCREEN.md` records the signature — a Δ of exactly zero with a
      # zero-width interval is not a null, it is two arms that played
      # byte-identical games — and `treatment_flags.rs` records that three tags
      # reached the gene tables in that state and "burned 30 games saying
      # nothing". `competition-victory-points` is in the tables now and cannot
      # fire at all, because `native_competitions` ships off. The doctrine was
      # written down four times and gated nowhere; this reads each gene's own
      # screen row and fails when a new one arrives with no evidence it ever
      # moved a game. Waivers with their reasons are in
      # `tools/gene_fire_waivers.json`, and one goes stale — and fails here —
      # as soon as its gene is proven or leaves the tables.
      - name: Every gene has been shown to fire in at least one game
        run: python3 tools/gene_fires.py --max 0

  # The published build at civvis.ai/beta compiles this same crate for the
  # browser (`src/wasm.rs`, gated to wasm32). `cargo test` never builds that
  # target, so a perfectly ordinary change to `Params` or to `server.rs` breaks
  # it while every gate stays green — which is exactly what happened: three
  # PRs merged clean and the next attempt to cut a build failed on four
  # unresolved names. This is `check`, not a full build: it costs a fraction of
  # the time and catches the whole class of failure, which is names and types
  # drifting out from under a target nobody compiles by hand.
  published-build:
    # Same zero-diff guard as cargo-test: the empty claim commit that opens
    # every task's draft PR carries nothing this job could check.
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Registry only, same reasoning as the native gate's cache: a
      # single-crate workspace with incremental off re-typechecks everything
      # on any change, so cached wasm `target` artifacts were dead weight
      # behind a never-resaved key.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-wasm-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-wasm-deps-${{ runner.os }}-
      - run: cargo check --lib --locked --target wasm32-unknown-unknown
      # The publish pipeline's own tests. #1289 moved the viewer's script to
      # assets/app.js and broke both the stable-lane build and these tests
      # without any gate noticing — the deploy failed days later instead.
      #
      # ⚠ DISCOVERED, NOT LISTED — THE LIST WAS THE BUG, for the second time.
      #
      # This step named five suites by hand and `beta/` holds six. The unnamed
      # one, `serve_test.py`, had been broken since `Handler` gained its
      # required `rating_host` argument and again since the published lane moved
      # to the root of its directory: it died on the first request and asserted
      # the landing page was the viewer. Nobody saw it, because nobody ran it.
      #
      # This is the same defect `collaboration-policy.yml` documents fixing on
      # the `tools/` side, and the same answer. `beta/` uses both naming
      # conventions — `test_*.py` and `*_test.py` — so a single `unittest
      # discover` pattern would still have missed half of them, and these are
      # plain scripts rather than test cases. Take every file matching either
      # convention and fail if the glob comes up empty, so a rename cannot
      # quietly empty the gate the way a hand-written list quietly shrank it.
      - name: The publish pipeline's own tests
        run: |
          cd beta
          shopt -s nullglob
          scripts=(test_*.py *_test.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no beta test scripts discovered — the glob or the naming moved"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "== $script"
            python3 "$script"
          done

  # The control mod is ~7k lines of Lua that no gate has ever compiled. It runs
  # inside Civ 6, so a syntax error does not fail a build — it fails a GAME, on
  # a machine with a 45-minute feedback loop, and the run just wedges. Cheap
  # insurance: `luac -p` every mod script, then run the one piece of agent logic
  # that has an argument rather than an engine call.
  control-mod:
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # ⚠⚠ 5.1 SPECIFICALLY, NOT "SOME LUA". Civilization VI's script runtime is
      # Lua 5.1, and the gap is not academic: `goto`/labels arrived in 5.2, so a
      # `goto continue` passes `luac5.4 -p` cleanly and then silently refuses to
      # load in the game. That exact mistake cost run settler-20260729T224210Z,
      # which sat in a configured game for half an hour emitting only autoclose
      # events because CivvisControlAgent.lua never loaded. A gate on the wrong
      # version would have called that commit green.
      - name: Install Lua 5.1 with a resilient Ubuntu mirror
        run: bash .github/scripts/install-apt-packages.sh lua5.1
      - name: Compile every mod script under the game's Lua version
        run: |
          set -eu
          find tools/civ6_control/mod tools/civ6_mod -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p
      # ⚠⚠⚠ `_G` IS FATAL IN THE GAME AND COMPILES FINE EVERYWHERE ELSE.
      # Civilization VI's UI Lua sandbox does not expose `_G`, so indexing it
      # raises at CHUNK LOAD and the agent never loads — no `loaded` event, no
      # seat, no orders, and a game that just sits there. It is valid Lua, so
      # `luac5.1 -p` above passes it, and no syntax-level 5.1 check can see
      # it: only naming `_G` itself does.
      #
      # This has now cost the project twice. `CivvisGrounding.lua` records it
      # ("the sandbox has no `_G`") and `CivvisControlAutoClose.lua` ends its
      # warning with "if anybody reaches for `_G` again" — and then #1047 did,
      # bricking every live game until #1052 reverted it on evidence alone,
      # unable to name the cause. Two prose warnings did not hold. This does.
      #
      # Bare globals are fine and the agent already uses them; only `_G` is
      # fatal. `grep -w` matters: a bare `_G` pattern also matches YIELD_GOLD,
      # DISTRICT_GARRISON and every PARAM_GOVERNOR_* constant. Comments are
      # excluded so the warnings themselves may keep naming it.
      - name: Reject `_G` in mod scripts
        run: |
          set -eu
          # `*_test.lua` is excluded: it runs under lua5.1 in this job, never
          # inside the game, and it uses `_G` deliberately to read the export.
          hits=$(find tools/civ6_control/mod tools/civ6_mod -name '*.lua' \
            ! -name '*_test.lua' -exec grep -nHw '_G' {} + \
            | grep -v '^[^:]*:[0-9]*:[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo "Civ 6's UI Lua sandbox does not expose _G; indexing it kills the script at load."
            exit 1
          fi
          echo "no _G references outside comments"
      # ⚠⚠⚠ A LADDER ENTRY THE GAME HAS NO TYPE FOR IS INVISIBLE — the ladder
      # just moves to the next line, every request still logs `applied: true`,
      # and nothing anywhere says the entry can never fire.
      #
      # This class has now appeared FIVE times in these scripts:
      # `BUILDING_ANCIENT_WALLS` (no such type; the development rung's only
      # defensive entry, unbuildable on every turn of every run),
      # `BUILDING_ART_MUSEUM` and `BUILDING_ARCHAEOLOGICAL_MUSEUM` (the rows
      # read subject-last — `BUILDING_MUSEUM_ART`, `BUILDING_MUSEUM_ARTIFACT`),
      # the floor's obsolete units in #748, and the seven district entries below
      # an open-ended gate. Each was repaired by fixing that one name. None of
      # them added a way to find the next one, and the `BUILDING_WALLS` comment
      # describing the trap sat three lines below two live instances of it.
      #
      # `civvis_orders` closed this class on the Rust side in #959 with
      # `every_name_the_order_channel_can_emit_exists_in_civilization_vi`. That
      # guards the lane deciding 20.8% of live builds. This guards the other
      # 79.2%.
      #
      # ⚠ Comments are stripped first, deliberately: the warnings above name the
      # bad spellings on purpose and must stay legible.
      - name: Every type the ladder names exists in Civilization VI
        run: |
          set -eu
          python3 - <<'PY'
          import json, pathlib, re, sys

          shipped = set(json.loads(pathlib.Path("data/civ6_type_names.json").read_text()))
          # Harvested from the shipped rule files by tools/civ6_type_names.py, which
          # excludes DLC/CivvisControl — our own mod is installed into the game's
          # Assets tree, so a scan including it reads our invented names back as
          # proof the game has them. That is exactly how BUILDING_ARCHAEOLOGICAL_MUSEUM
          # looked legitimate on first inspection.
          if len(shipped) < 400:
              sys.exit(f"snapshot has only {len(shipped)} names; it is not the shipped ruleset")

          bad = []
          for path in sorted(pathlib.Path("tools").glob("civ6*/**/*.lua")):
              code = "\n".join(re.sub(r"--.*$", "", line) for line in path.read_text().splitlines())
              for name in sorted(set(re.findall(r'"((?:DISTRICT|BUILDING|UNIT|PROJECT|IMPROVEMENT)_[A-Z0-9_]+)"', code))):
                  if name not in shipped:
                      bad.append(f"{path}: {name}")

          if bad:
              print("\n".join(bad))
              sys.exit(
                  "\nCivilization VI ships no such type. A ladder entry that cannot fire is "
                  "invisible -- the ladder moves to the next line and the run looks healthy. "
                  "Check the shipped spelling in Cache/DebugGameplay.sqlite."
              )
          print("every ladder type literal exists in Civilization VI")
          PY
      # ⚠⚠ THE 200-LOCAL CEILING IS A LOAD FAILURE, NOT A WARNING, and the agent
      # is two slots from it. Lua 5.1 allows 200 local variables in a chunk's
      # main function; at 201 `luac5.1 -p` above refuses the file outright and
      # in the game the script simply never loads — no error anywhere the run
      # can see, which is the same silent death `_G` and `goto` already cost
      # this project. Three ordinary `local` declarations added while writing
      # #1839 crossed it. The compile step catches it; this says so in advance,
      # with the number, so the next person is not debugging "more than 200
      # local variables" from a red build.
      - name: Local-slot headroom in the control agent
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          path = pathlib.Path("tools/civ6_control/mod/CivvisControlAgent.lua")
          slots = 0
          for line in path.read_text().splitlines():
              match = re.match(r"^local(?: function)? ([A-Za-z_][A-Za-z0-9_, ]*)", line)
              if not match:
                  continue
              slots += 1 if line.startswith("local function") else len(
                  [n for n in match.group(1).split(",") if n.strip()])
          print(f"{path}: ~{slots} of Lua 5.1's 200 main-chunk local slots")
          if slots > 200:
              sys.exit("over the limit; the chunk will not load in the game. "
                       "Make new top-level values bare globals instead — see "
                       "the note on CivvisResidualBucket.")
          if slots > 190:
              print(f"::warning::only ~{200 - slots} local slot(s) left; prefer "
                    "a bare global for anything new at the top level")
          PY
      # ⚠ DISCOVERED, NOT LISTED — THE LIST WAS THE BUG TWICE ALREADY.
      #
      # These six were named one per step, which is the same shape that left
      # twenty-five `tools/` suites ungated (fixed in collaboration-policy.yml)
      # and one of `beta/`'s six scripts broken for two separate reasons with
      # nobody running it (#1905). The list happens to be complete today; what
      # it cannot do is stay complete on its own, and a mod test that no gate
      # runs fails inside Civilization VI on a machine with a 45-minute
      # feedback loop.
      #
      # Fails when the glob comes up empty, so a rename cannot quietly empty
      # the gate the way a hand-written list quietly shrinks it.
      - name: Every mod test the tree ships
        run: |
          shopt -s nullglob
          tests=(tools/civ6_control/mod/*_test.lua)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no mod tests discovered - the glob or the naming moved"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "== $t"
            lua5.1 "$t"
          done
