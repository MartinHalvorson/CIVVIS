name: wasm-profile

on:
  workflow_dispatch:
    inputs:
      qualified_run:
        description: Successful wasm-qualify run containing the production module and function map
        required: true
      source:
        description: Exact 40-character source SHA recorded by that qualification
        required: true
      case:
        description: Normal benchmark case (default-7/8/9 or six-7311001/2/3)
        default: six-7311003
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: wasm-profile-${{ github.ref }}-${{ inputs.qualified_run }}-${{ inputs.case }}
  cancel-in-progress: false

jobs:
  wasm-profile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Test profile provenance and completion guards without playing games
        run: python3 -m unittest discover -s tools -p test_site_wasm_profile_ci.py -v
      - name: Download the qualified engine
        uses: actions/download-artifact@v4
        with:
          name: civvis-wasm-qualification
          run-id: ${{ inputs.qualified_run }}
          github-token: ${{ github.token }}
          path: qualified
      - name: Profile one full normal game from the exact qualified module
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ inputs.qualified_run }}
          PROFILE_SOURCE: ${{ inputs.source }}
          PROFILE_CASE: ${{ inputs.case }}
        run: |
          python3 tools/site_wasm_profile_ci.py \
            --qualified qualified --source "$PROFILE_SOURCE" --run "$QUALIFIED_RUN" \
            --repo "$GITHUB_REPOSITORY" --case "$PROFILE_CASE" --out profile
      - name: Preserve the bound module, CPU samples, raw save and frame hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civvis-wasm-cpu-profile
          path: profile
          if-no-files-found: warn
