name: promote-site

# Makes a chosen revision the front page of civvis.ai.
#
# The site has two lanes: `/beta` follows main automatically, and `/` is
# whatever the `site-stable` tag names. This workflow is the only thing that
# moves that tag. Promotion is deliberately a human act — the automated lane
# proves a build runs; whether it is worth being the thing a visitor lands on
# is a judgement.
#
#   Actions -> promote-site -> Run workflow -> ref = main (or any sha/tag)
#
# The tag is a pointer, not a release: it is expected to move, which is why it
# is pushed with force and why nothing else may use it. After moving it, this
# runs the ordinary publish-site job, so a promotion deploys exactly what the
# schedule would have deployed with the same tag — one code path, no drift.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to promote to civvis.ai"
        default: "main"

permissions:
  contents: write

concurrency:
  group: promote-site
  cancel-in-progress: false

jobs:
  move-the-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point site-stable at the chosen revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "${{ inputs.ref }}^{commit}")"
          echo "promoting $sha"
          git tag -f site-stable "$sha"
          git push -f origin refs/tags/site-stable
          echo "### Promoted \`$sha\` to civvis.ai" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: move-the-tag
    uses: ./.github/workflows/publish-site.yml
    secrets: inherit
    with:
      deploy: true
