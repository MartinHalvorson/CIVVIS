name: release

# The downloads behind civvis.ai/download.
#
# The point of the published site is that the browser build is a *demonstration*
# — a whole engine slowed to something a tab can carry. The real thing is this:
# one self-contained program, no installer, no runtime, no network, running
# games as fast as the machine will run them and still running them years from
# now. So the binaries have to exist, they have to be built the same way every
# time, and their addresses have to be permanent.
#
# `beta/download.html` links `releases/latest/download/<asset>`, which GitHub
# resolves to the newest release. That is why the asset names below are fixed
# and must not acquire version numbers: a versioned name would break the page
# on every release.
#
#   git tag v0.6.1 && git push origin v0.6.1
#
# The "Run workflow" button does the same thing without publishing, which is
# how you find out that a target stopped compiling before a tag is public.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One target failing should not deny the other three a release; a
      # partial set of downloads beats none, and the gap is visible on the
      # release page.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: civvis-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: civvis-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: civvis-macos-aarch64
          # `macos-15-intel`, not `macos-13`: GitHub retired the macOS 13
          # image, and a job asking for a retired label does not fail — it
          # queues, and with `fail-fast: false` the other three legs go green
          # around it, so the symptom is a release that looks fine and is
          # missing exactly one download. Measured on the first dispatch:
          # three targets built in under twelve minutes while this one sat
          # unassigned for forty.
          #
          # ⚠ `timeout-minutes` DOES NOT BOUND THAT WAIT. It starts when a
          # runner picks the job up, so a job no runner will ever claim is not
          # covered by it at all; GitHub's own 24-hour queue limit is what
          # eventually cancels one. This comment said the timeout killed it,
          # and believing that is how run 31116714949 sat `queued` for 390
          # hours before anybody looked (see the `publish` job below).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: civvis-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      # The full `release` profile, not `ci`: this is the binary whose whole
      # selling point is speed, so it gets the single codegen unit and the LTO
      # pass that the test gate deliberately skips.
      - name: Build
        run: cargo build --release --locked --bin civvis --target ${{ matrix.target }}

      # A binary that cannot play a game is not a release. This is cheap
      # (a small map, a few turns) and catches the class of failure where the
      # thing links fine and dies on first contact with its own embedded data.
      - name: Prove it runs
        run: cargo run --release --locked --bin civvis --target ${{ matrix.target }} -- simulate --players 4 --width 24 --height 16 --turns 20 --seed 1

      - name: Name it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # MSVC keeps symbols in the .pdb, which is never shipped; the .exe
            # has nothing to strip.
            cp "target/${{ matrix.target }}/release/civvis.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/civvis" "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
            # Only the packaged copy is stripped: fleet and CI builds keep
            # their symbol tables because crash backtraces from a running
            # spectator are worth more than 2 MB, but a download's ~9% of
            # symbol bytes serves nobody. macOS gets `-x` — a full strip
            # rejects Mach-O executables over indirect-symbol references —
            # and Apple's strip re-signs the ad-hoc signature itself.
            if [ "${{ runner.os }}" = "macOS" ]; then
              strip -x "dist/${{ matrix.asset }}"
            else
              strip "dist/${{ matrix.asset }}"
            fi
          fi
          # Published beside the binary so anyone can check what they got
          # without trusting the download page. The runners disagree about
          # which of these two they ship.
          (
            cd dist
            if command -v sha256sum >/dev/null; then
              sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
            else
              shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
            fi
          )
          ls -l dist

      # "Prove it runs" exercised the binary strip has since rewritten. A bad
      # strip fails at exec time — on arm64 macOS it can invalidate the ad-hoc
      # code signature — so prove the exact bytes being uploaded, not their
      # ancestor. Windows ships the unmodified build and is already proven.
      - name: Prove the stripped asset runs
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/${{ matrix.asset }} simulate --players 4 --width 24 --height 16 --turns 20 --seed 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Every other job in every workflow here declares one; this was the only
    # one left on the 360-minute default, and it is the job that uploads to a
    # public download page. Downloading four artifacts and cutting a release
    # is a two-minute step, so fifteen is generous and still fails the same
    # day rather than six hours later.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist

      # A release missing one platform is the failure this workflow is most
      # likely to have, and the least likely to be noticed: `/download` links
      # fixed names at "the latest release", so an absent asset is not a
      # smaller release, it is a permanent 404 on a page whose only job is
      # handing somebody a program. The expected names are read from that page
      # rather than repeated here, so there is one source of truth for them.
      - name: Every download the site links is here
        run: |
          set -euo pipefail
          missing=0
          while read -r asset; do
            if [ -s "dist/$asset" ]; then
              echo "  ok      $asset"
            else
              echo "::error::beta/download.html links $asset, which this release does not contain"
              missing=1
            fi
          done < <(grep -o 'releases/latest/download/[^"]*' beta/download.html | sed 's|.*/||' | sort -u)
          exit $missing
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            One self-contained program per platform. No installer, no runtime,
            no network — download it, mark it executable on macOS and Linux,
            and it plays whole games at whatever speed your processor manages.

            ```
            civvis simulate --players 8 --turns 500    one whole game, printed
            civvis benchmark                           turns a second on this machine
            civvis play                                the viewer, served locally
            ```

            macOS builds are unsigned; the first run needs clearing in
            Privacy & Security. Checksums are published beside each binary.
