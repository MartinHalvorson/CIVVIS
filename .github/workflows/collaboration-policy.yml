name: collaboration-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # `github.sha` on a push, for the reason spelled out in tests.yml: on `main`
  # the ref is one constant, so with `cancel-in-progress: true` every merge
  # cancelled the previous merge's run and `main`'s own verdict was whatever
  # the last quiet minute happened to allow. A commit is not superseded by the
  # commit after it. On a pull request a newer push does supersede an older
  # one, and cancelling there is pure savings.
  group: collaboration-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  collaboration-policy:
    # Hosted, for the same reason as cargo-test — see the note there.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch clean source revisions for provenance checks
        # `tools/genes.py` checks a stamped screen against the exact commit its
        # binary played. Keep this routine checkout shallow, but fetch each
        # source the ledger says is independently verifiable; an explicit
        # `unverified` exception stays an exception instead of a broken fetch.
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          ledger = json.loads(Path("docs/gene_ledger.json").read_text())
          commits = set()
          for group in ("sources", "reporting_batches"):
              for entry in ledger.get(group, []):
                  if entry.get("unverified"):
                      continue
                  commit = (entry.get("build") or {}).get("commit", "")
                  if not commit:
                      continue
                  if not re.fullmatch(r"[0-9a-f]{40}", commit):
                      raise SystemExit(
                          f"{entry.get('path', group)} has an invalid build commit: {commit!r}"
                      )
                  commits.add(commit)
          for commit in sorted(commits):
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--depth=1", "origin", commit],
                  check=True,
              )
          PY
      # ⚠ DISCOVERED, NOT LISTED — THE LIST WAS THE BUG.
      #
      # This step named six suites by hand, so the other twenty-five in
      # `tools/` were run by nobody. Four had been red for days when anyone
      # finally ran them: `test_civ6_production.py` pinned two building names
      # Civilization VI has never had, `test_civ6_launcher.py` reached for an
      # install that only exists on a play host, `test_civ6_play.py` could not
      # even be collected, and `test_update_readme_rankings.py` raised on a
      # README a human had shortened. Every one of them is a check that exists
      # precisely to catch a regression, quietly not catching regressions.
      #
      # `test_civvis_desktop_apps.py` is the precedent for the shape of the
      # answer: it was added here in #1349 after three days red, and its
      # macOS-only cases carry `skipUnless` so they skip on this runner rather
      # than fail. A suite that cannot run on ubuntu belongs behind that same
      # guard — it does not belong outside the gate.
      #
      # 647 tests, ~17s. Adding a suite now costs nothing and forgetting to
      # register one is no longer possible.
      - name: Test the repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check generated evaluation status
        run: python3 tools/eval_manifest.py --check
      - name: Validate branch, ownership, overlap, and commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/civvis_collab.py check-pr
