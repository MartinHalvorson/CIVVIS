name: collaboration-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: collaboration-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collaboration-policy:
    # Hosted, for the same reason as cargo-test — see the note there.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ⚠ DISCOVERED, NOT LISTED. This step named three files by hand, so a new
      # tools/test_*.py was invisible to CI until someone remembered to edit this
      # line — and nobody did. The list ran 98 tests; discovery runs 210. The 112 in
      # between included the whole of tools/test_spectator_supervisor.py, which was
      # FAILING on main the entire time it went unrun, on the measurement the
      # supervisor uses to decide whether to restart a wedged server.
      #
      # It is also part of why the Civilization VI harness reached 18k lines with no
      # test at all: there was no place a new one would automatically run.
      # Do not go back to a list.
      - name: Test the policy engine and the harness tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate branch, ownership, overlap, and commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/civvis_collab.py check-pr
