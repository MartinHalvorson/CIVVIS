name: collaboration-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: collaboration-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collaboration-policy:
    # Hosted, for the same reason as cargo-test — see the note there.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ⚠ THIS LIST IS HAND-MAINTAINED AND THAT IS ITS OWN DEFECT. A new
      # tools/test_*.py is invisible to CI until someone remembers this line, which
      # is part of why the Civilization VI harness reached 18k lines with no test at
      # all. Discovery is the right answer and is NOT done here because
      # tools/test_spectator_supervisor.py currently fails two assertions on main —
      # switching to discovery in this change would turn someone else's red into
      # this branch's problem. Fix that, then delete this comment and glob.
      - name: Test the policy engine and the harness tools
        run: python3 -m unittest tools/test_civvis_collab.py tools/test_civvis_push_guard.py tools/test_civvis_fleet.py tools/test_civ6_civvis_climb.py
      - name: Validate branch, ownership, overlap, and commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/civvis_collab.py check-pr
