name: to-test-auto-30

# to-test-auto-30 — builds and publishes civvis.ai, both lanes in one deployment:
# the name says the automatic half — /test refreshes on a half-hourly tick —
# and to-prod-manual-only says the other half.
#
#   /        the STABLE lane: whatever the `site-stable` tag names. It moves
#            only when somebody runs to-prod-manual-only, because
#            whether a build is worth being the front page is a judgement,
#            and no gate can make it.
#   /test    the HEAD lane: origin/main as of this run, republished on a
#            schedule. It exists so the newest engine is always playable
#            without anyone deciding anything.
#
# Every deployment carries both lanes. That is not an implementation shortcut,
# it is what Cloudflare Pages deployments are: immutable snapshots of a whole
# directory. There is no such thing as updating half a site, so each deploy
# rebuilds the stable lane from its pinned tag and the test lane from head,
# assembles one directory, and ships it. Both lanes therefore always exist,
# and a promotion is nothing but moving the tag and deploying again.
#
# **The cadence: every commit, half an hour of cooldown, one governor.**
# The schedule fires every 30 minutes, and the `gate` job decides whether a
# deploy is worth it:
#
#   - Nothing new? If /test already serves the commit this run would publish,
#     skip in seconds, before any toolchain is installed.
#   - Budget. Cloudflare Pages allows 500 deployments a month, and this
#     repository has merged several hundred commits a day — an ungoverned
#     half-hour cadence is ~1,440 a month, three times the cap, and blowing
#     the cap would block promotions too, which are deployments like any
#     other. So scheduled runs pace themselves against 440 a month
#     (~14 a day), pro rata by the day of the month, and the other 60 stay
#     reserved for to-prod-manual-only and manual runs, which never wait.
#
# The effect: on a quiet day the test lane is fresh within about half an hour
# of a commit (GitHub's cron drifts some minutes under load); in a week of
# round-the-clock merging, the governor stretches the spacing toward ~100
# minutes rather than dying mid-month.
#
# Without the Cloudflare secrets this still builds and checks both lanes and
# keeps the assembled site as an artifact — a scheduled run degrades to a dry
# run rather than a red X, so the schedule is safe to leave on before the
# Cloudflare account exists.

on:
  schedule:
    # Minutes 7 and 37, not 0 and 30: GitHub delays and drops on-the-hour
    # cron jobs under load, and odd minutes dodge the rush.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Pages (otherwise build and check only)"
        type: boolean
        default: true
  # to-prod-manual-only runs this same job after moving the site-stable tag,
  # so a promotion cannot drift from what the schedule does.
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: to-test-auto-30
  cancel-in-progress: false

jobs:
  # The half-hourly schedule earns its keep here: seconds of API calls decide
  # whether twenty minutes of building is worth starting. Only scheduled runs
  # are ever gated — a person clicking Run workflow and a promotion calling in
  # have both already decided.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Is a scheduled deploy worth it?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "not a scheduled run; no gate"
            exit 0
          fi

          # Nothing new: the test lane already serves this commit. pages.dev
          # rather than the custom domain, so a domain hiccup cannot make
          # every run look novel. An unreachable site reads as "new" — the
          # deploy is then the corrective act, not a waste.
          live="$(curl -fsS --max-time 10 https://civvis.pages.dev/test/build.json \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' \
                  2>/dev/null || echo unknown)"
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "/test already serves $GITHUB_SHA; nothing to do"
            exit 0
          fi

          # Budget: pace scheduled deploys against 440 of Cloudflare's 500
          # per month, pro rata by day, so promotions always have room.
          # Successful runs of this workflow and to-prod-manual-only approximate
          # deployments; dry runs inflate the count, which errs safe. The two
          # names these workflows carried before 2026-08-04 stay in the sum:
          # a rename must not amnesty the deployments already spent this month.
          month_start="$(date -u +%Y-%m-01)"
          day="$(date -u +%-d)"
          days_in_month="$(python3 -c 'import calendar,datetime; now=datetime.datetime.utcnow(); print(calendar.monthrange(now.year, now.month)[1])')"
          used=0
          for wf in to-test-auto-30.yml to-prod-manual-only.yml publish-site.yml promote-site.yml; do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=success&created=>=${month_start}&per_page=1" --jq '.total_count' || echo 0)"
            used=$((used + n))
          done
          allowed=$((440 * day / days_in_month))
          echo "deploys used this month: $used; pace allows: $allowed (day $day/$days_in_month)"
          if [ "$used" -ge "$allowed" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "ahead of the monthly budget; the next half-hour tick will ask again"
            exit 0
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # schedule has no inputs; a scheduled run always wants to deploy.
      WANT_DEPLOY: ${{ github.event_name == 'schedule' && 'true' || inputs.deploy }}
      # publish.sh --commit builds in a throwaway worktree, whose default
      # target dir would miss the cache above every time. One shared target
      # dir means the second lane's build starts warm from the first's, and
      # both start warm from the last run's.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          # The stable lane is built from whatever `site-stable` names, which
          # can be any commit — so the whole history, and the tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-wasm-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-publish-

      - name: Toolchain for the bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binaryen brotli
          python3 -m pip install --quiet --disable-pip-version-check pillow
          wasm-opt --version

      - name: Resolve the two lanes
        id: lanes
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          # Before the first promotion the tag does not exist; the stable lane
          # then follows head, so the site is whole from day one and the first
          # promote simply pins it.
          stable="$(git rev-parse --verify --quiet 'refs/tags/site-stable^{commit}' || echo "$head")"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "stable lane: $stable"
          echo "test lane:   $head"

      - name: Build the stable lane
        run: ./beta/publish.sh --commit "${{ steps.lanes.outputs.stable }}" --out "$PWD/lane-stable"

      - name: Build the test lane
        run: |
          if [ "${{ steps.lanes.outputs.stable }}" = "${{ steps.lanes.outputs.head }}" ]; then
            # Same commit, same bundle; a second three-minute wasm build would
            # prove nothing. cp keeps the two-lane assembly identical either way.
            cp -R lane-stable lane-test
          else
            ./beta/publish.sh --commit "${{ steps.lanes.outputs.head }}" --out "$PWD/lane-test"
          fi

      # One site from the two lanes. publish.sh emits a single-lane shape —
      # landing at index.html, viewer under test/ — and the viewer is
      # relative-pathed, so it works at any mount point. The head build
      # provides the shell (landing, download page, _worker.js, its viewer as
      # /test); the stable build's viewer is then mounted at the root; the
      # landing page becomes a real file at /home.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site
          cp -R lane-test site
          mkdir -p site/home
          mv site/index.html site/home/index.html
          cp -R lane-stable/test/. site/
          echo "root  $(python3 -c "import json;print(json.load(open('site/build.json'))['short'])")"
          echo "test  $(python3 -c "import json;print(json.load(open('site/test/build.json'))['short'])")"

      - name: Check the routing
        run: ./beta/worker_test.py

      - name: Check the stable lane plays
        run: ./beta/verify.py --dist site --mount root --seconds 40

      - name: Check the test lane plays
        run: ./beta/verify.py --dist site --mount test --seconds 40 --no-gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civvis-site
          path: |
            site
            beta/verify-root.png
            beta/verify-test.png
          if-no-files-found: warn
          retention-days: 14

      - name: Refuse a requested deploy without credentials
        if: ${{ env.WANT_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN == '' && github.event_name != 'schedule' }}
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set." \
               "Add them under Settings -> Secrets and variables -> Actions," \
               "or run this workflow with deploy unchecked."
          exit 1

      - name: Note a scheduled run with nowhere to deploy
        if: ${{ env.WANT_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN == '' && github.event_name == 'schedule' }}
        run: echo "::warning::No Cloudflare credentials; built and checked both lanes, deployed nothing."

      # So that standing the site up needs no machine with wrangler on it:
      # the first real run creates the Pages project itself, and every later
      # run finds it already there and moves on. Failure here is deliberately
      # soft — "already exists" is the normal case and wrangler's exit codes
      # do not distinguish it — because the deploy immediately after is the
      # real gate: no project, and it fails loudly by name.
      - name: Ensure the Pages project exists
        if: ${{ env.WANT_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx --yes wrangler pages project create civvis --production-branch main \
            || echo "project civvis already exists (or the deploy below will say why not)"

      - name: Deploy to Cloudflare Pages
        if: ${{ env.WANT_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name civvis --branch main

      - name: Where it went
        if: ${{ env.WANT_DEPLOY == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          {
            echo "### Published"
            echo
            echo "| lane | commit |"
            echo "| --- | --- |"
            echo "| civvis.ai (stable) | \`$(python3 -c "import json;print(json.load(open('site/build.json'))['short'])")\` |"
            echo "| civvis.ai/test (head) | \`$(python3 -c "import json;print(json.load(open('site/test/build.json'))['short'])")\` |"
            echo
            echo "- https://civvis.ai — the promoted build"
            echo "- https://civvis.ai/test/ — the latest main"
            echo "- https://civvis.ai/home — the landing page"
            echo "- https://civvis.ai/download/ — the native binaries"
          } >> "$GITHUB_STEP_SUMMARY"
