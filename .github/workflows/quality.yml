name: rust-quality

# This is an incremental gate. The crate still carries a known clippy
# backlog; requiring a clean repository-wide run would make every new PR
# inherit unrelated debt. New or edited Rust files must nevertheless be
# formatted and warning-free, so the backlog cannot grow.
#
# The *formatting* half of that backlog is gone: #2659 swept the whole tree
# with `cargo fmt`, so `cargo fmt --check` and per-file
# `rustfmt --check --edition 2021` are both silent on `main`. The gate stays
# incremental anyway — it is what keeps the tree clean, and it is the only
# half of this job that also covers clippy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.sha` on a push, for the reason spelled out in tests.yml: on `main`
  # the ref is one constant, so with `cancel-in-progress: true` every merge
  # cancelled the previous merge's run and `main`'s own verdict was whatever
  # the last quiet minute happened to allow. A commit is not superseded by the
  # commit after it. On a pull request a newer push does supersede an older
  # one, and cancelling there is pure savings.
  group: rust-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check changed Rust files
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD: ${{ github.sha }}
        run: python3 tools/rust_quality.py
