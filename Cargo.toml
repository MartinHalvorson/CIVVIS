[package]
name = "civvis"
version = "0.6.0"
edition = "2021"
default-run = "civvis"
description = "Martin Halvorson's Civilization VIS - Rust performance core (headless Civ 6-style engine)"
license = "GPL-3.0-or-later"

[lib]
name = "civvis"
path = "src/lib.rs"

[[bin]]
name = "civvis"
path = "src/main.rs"

[features]
# Closed experiment executables remain reproducible evidence, but they are not
# part of the default product or CI target surface.
closed-experiments = []

[[bin]]
name = "science_parallelism_eval"
path = "experiments/closed/science_parallelism_eval.rs"
required-features = ["closed-experiments"]

[[bin]]
name = "reactor_conversion_eval"
path = "experiments/closed/reactor_conversion_eval.rs"
required-features = ["closed-experiments"]

[[bin]]
name = "faith_conversion_eval"
path = "experiments/closed/faith_conversion_eval.rs"
required-features = ["closed-experiments"]

[[bin]]
name = "q_override_train"
path = "experiments/closed/q_override_train.rs"
required-features = ["closed-experiments"]

[[bin]]
name = "q_pairwise_calibrate"
path = "experiments/closed/q_pairwise_calibrate.rs"
required-features = ["closed-experiments"]

[dependencies]
# Explicit soft-float transcendentals for world geometry. IEEE-754 does not pin
# `sin`/`cos`/`asin`/`atan2`, and the platform math libraries round them
# differently, so the same seed generated a different globe on wasm32 than on
# native (#1061). Everything that turns a seed into tiles calls this crate's
# implementations (via `sphere::trig`) instead of the platform's.
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
# One codegen unit is worth about four percent of simulation throughput.
# Full LTO on top of it measured no further gain and only cost build time.
codegen-units = 1

# The CI gate compiles this 100k-line crate on every push. `codegen-units = 1`
# serialises the whole backend and `lto` adds a link-time pass; together they
# buy about four percent simulation throughput, which the gate does not need
# and which the production spectator build still gets from `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
# ⚠ `release` turns debug assertions OFF, and the CI gate inherits it — so
# every `debug_assert!` in the crate was compiled out of the only build that
# gates a merge. They are not cheap comments: they guard vector widths
# (`decision_features`, `action_space`), tile-claim uniqueness (`sphere`), a
# score range (`ai_eval`), and the agreement between the artifact alias table
# and the provenance row (`elo`).
#
# That last one shipped broken. `live_without_district_coverage` reached
# `main` with no provenance row, so the arm silently identified itself as
# `basic`, and two tests failed for anyone running the dev profile while every
# CI run stayed green (#1008). A second arm repeated it within the hour
# (#1005). Turning them on here costs a little test runtime and nothing in the
# shipped `release` build, which does not inherit this profile.
debug-assertions = true
